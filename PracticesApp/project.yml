name: Practices
options:
  bundleIdPrefix: dev.practices
  createIntermediateGroups: true
packages:
  PracticesCore:
    path: ../PracticesCore
targets:
  Practices:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/Practices
        excludes:
          - "Info.plist"
    dependencies:
      - package: PracticesCore
        product: PracticesCore
      # Built, not linked: the script below puts it in Contents/Helpers, and «Начало» copies it into ~/.practices/bin.
      - package: PracticesCore
        product: practicesctl
        link: false
    postBuildScripts:
      - name: Embed practicesctl
        basedOnDependencyAnalysis: false
        script: |
          set -e
          HELPERS="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          mkdir -p "$HELPERS"
          rm -rf "$HELPERS/practicesctl" "$HELPERS/PracticesCore_PracticesCore.bundle"
          cp "${BUILT_PRODUCTS_DIR}/practicesctl" "$HELPERS/"
          # Next to the binary: the CLI finds its resources there, here and once copied to ~/.practices/bin.
          cp -R "${BUILT_PRODUCTS_DIR}/PracticesCore_PracticesCore.bundle" "$HELPERS/"
          # uv runs practices' Python (DECISIONS 40): pinned, cached in build/uv.
          "${PROJECT_DIR}/../tools/fetch-uv.sh" "$HELPERS"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$HELPERS/PracticesCore_PracticesCore.bundle" "$HELPERS/practicesctl" "$HELPERS/uv"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.practices.app
        PRODUCT_NAME: Practices
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        # Not sandboxed: it runs git, gh, glab and uv, and practices reach internal services.
        ENABLE_APP_SANDBOX: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
        # «Embed practicesctl» reads the build products and writes into the app bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # Both, like Tandem: the generated keys below are merged into this file, which exists
        # only to carry NSAppTransportSecurity. Health checks and practices talk plain HTTP to
        # internal services (ClickHouse on :8123), which ATS would refuse (-1022).
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Sources/Practices/Info.plist
        # Menu-bar agent for now (stage 1); the main window arrives with sources in stage 2.
        INFOPLIST_KEY_LSUIElement: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Practices"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
